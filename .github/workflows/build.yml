name: Build CLI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  verify-macos:
    name: Verify exVMs on macOS
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build-tag-artifact:
    name: Build tagged exVMs artifact
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release CLI
        run: cargo build --release --bin exvms

      - name: Stage CLI artifact
        run: |
          mkdir -p dist
          cp target/release/exvms dist/exvms
          chmod +x dist/exvms

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: exvms-macos-${{ runner.arch }}
          path: dist/exvms
          if-no-files-found: error
