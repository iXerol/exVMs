name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  verify-cli:
    name: Verify CLI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Run CLI clippy
        run: cargo clippy --all-targets --features cli -- -D warnings

      - name: Run tests
        run: cargo test --features cli

  verify-macos-app:
    name: Verify macOS App
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Run macOS app tests
        run: xcodebuild -workspace exVMs.xcworkspace -scheme exVMsApp -destination 'platform=macOS' -derivedDataPath /tmp/exvms-dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test -only-testing:exVMsAppTests

  build-tag-artifact:
    name: Build tagged exVMs artifact
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release CLI
        run: cargo build --release --bin exvms --features cli

      - name: Stage CLI artifact
        run: |
          mkdir -p dist
          cp target/release/exvms dist/exvms
          chmod +x dist/exvms

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: exvms-macos-${{ runner.arch }}
          path: dist/exvms
          if-no-files-found: error
