[package]
name = "exvms"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
filetime = "0.2.27"
libc = "0.2.182"
rayon = "1.11.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.24.0"

[[bin]]
name = "exvms"
path = "src/main.rs"
